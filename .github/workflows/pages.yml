name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装静态站点（纯前端，无需构建）
        run: |
          mkdir -p dist
          cp -r index.html css js ai-chinese-chess.html dist/
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # 仓库从未启用过 Pages 时自动开启（需 pages: write 权限，已声明）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
